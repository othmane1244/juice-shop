# Audit DevSecOps — ligne de base Trivy acceptée (4 novembre 2026).
#
# But : la CI ne bloque que les NOUVELLES vulnérabilités CRITICAL/HIGH
# corrigeables (et les nouveaux secrets). Chaque entrée ci-dessous existait
# déjà dans bkimminich/juice-shop:v20.3.0 et reste hors du périmètre de la
# série de corrections JWT / file-type / HEALTHCHECK.
#
# Règles :
# - une entrée vise un couple (avis, paquet@version) via son purl : la même CVE
#   sur un autre paquet ou une autre version n'est PAS ignorée;
# - chaque entrée expire le 2026-12-31 : passé cette date, la CI échoue à
#   nouveau et l'exception doit être revue (corrigée ou prolongée avec motif);
# - les analyses citées sont dans le dépôt d'audit, docs/analysis/NN-*.md.
#
# Source : scans Trivy 0.76.0 du dépôt (fs) et de l'image corrigée, options
# --severity CRITICAL,HIGH --ignore-unfixed, base du 2026-11-04.

